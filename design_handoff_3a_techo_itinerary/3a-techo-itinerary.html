 flight_home:{address:'成田國際機場 第 1 航廈',hours:'20:40 起飛／關櫃 19:40',description:'長榮航空，成田第 1 航廈南翼。Skyliner 坐到終點「成田空港」站，不是「空港第2ビル」。',mapUrl:''}
};

/* Prototype shortcut — production should store `category` on the event (see README → State Management) */
const TAPE = { transit:'交通', food:'美食', event:'活動', spot:'景點', stay:'住宿' };
function categorize(e) {
  const t = e.d;
  if (/入住|退房|飯店|抵達舞家|放行李|寄行李|取回行李|取行李|行李交櫃檯|宅配/.test(t)) return 'stay';
  if (/→|線|新幹線|特急|ラピート|Skyliner|起飛|下車|集合|解散|步行|走到|走路|前往|回市中心|出發|離開|回飯店|買 Suica/.test(t)) return 'transit';
  if (/早餐|午餐|晚餐|Coffee|蓬萊軒|うな富士|ひつまぶし|釜匠|BEEF|鯛焼|どら焼き|モンブラン|栗りん|ロッキンロビン|Cheese|うさぎや|超商/.test(t)) return 'food';
  if (/盆踊り|ART&LIGHTS|活動|プラネタリア|Sky Garden|夜景|AIR CABIN|整理券|排隊/.test(t)) return 'event';
  return 'spot';
}

const TABS = [['行程',1],['準備',0],['記帳',0],['行李',0],['購物',0],['資訊',0]];
/* Tab icon paths are the same 24-box strokes as components/TabBar.tsx TAB_META */
const TAB_SVG = [
  '<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18"/><path d="M8 3v4M16 3v4"/><circle cx="12" cy="15" r="1.4" fill="currentColor" stroke="none"/>',
  '<rect x="4" y="4" width="16" height="17" rx="3"/><path d="M8.5 12.5l2.5 2.5 4.5-4.5"/>',
  '<circle cx="12" cy="12" r="9"/><text x="12" y="16.5" text-anchor="middle" font-size="13" font-weight="bold" stroke="none" fill="currentColor">¥</text>',
  '<rect x="4" y="7" width="16" height="14" rx="3"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/><path d="M4 13h16"/>',
  '<circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>',
  '<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8v.01"/>'
];

const CLOCK_SVG = '<circle cx="12" cy="12" r="9"></circle><polyline points="12 7.5 12 12 15.5 14"></polyline>';
const PIN_SVG = '<path d="M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 0 1 16 0z"></path><circle cx="12" cy="10" r="2.6"></circle>';
const MAP_SVG = '<polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"></polygon><line x1="8" y1="2" x2="8" y2="18"></line><line x1="16" y1="6" x2="16" y2="22"></line>';

let dayIdx = 0, openIdx = null;
const esc = s => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

function renderDays() {
  document.getElementById('dayRow').innerHTML = ITINERARY.map((d, i) => {
    const on = i === dayIdx;
    return `<button data-day="${i}" style="flex:1; min-width:0; height:56px; border:1px solid ${on?'#5C4033':'#E4DBCB'}; border-radius:6px; cursor:pointer; background:${on?'#5C4033':'#FFFFFF'}; color:${on?'#FFFFFF':'#5A5249'}; box-shadow:${on?'0 3px 10px rgba(92,64,51,0.26)':'0 1px 3px rgba(43,43,43,0.05)'}; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px; transition:background 240ms ease-in-out, color 240ms ease-in-out;">
      <span style="font-size:10px; font-weight:500; letter-spacing:0.06em;">${d.weekday[2]}</span>
      <span style="font-size:19px; font-weight:500; line-height:1; font-family:'DM Sans',sans-serif;">${d.date.split('/')[1]}</span>
    </button>`;
  }).join('');
}

function renderDay() {
  const d = ITINERARY[dayIdx];
  document.getElementById('dayNo').textContent = 'DAY ' + (dayIdx + 1);
  document.getElementById('dayDate').textContent = d.date + '\u3000' + d.weekday;
  document.getElementById('dayAccom').textContent = d.accommodation || '當日返台・無住宿';
  document.getElementById('dayTitle').textContent = d.title;

  document.getElementById('timeline').innerHTML = d.events.map((e, i) => {
    const hl = !!e.h;
    return `<div style="display:flex; gap:12px;">
      <div style="flex:none; width:44px; display:flex; flex-direction:column; align-items:center;">
        <span style="font-size:12px; font-weight:500; letter-spacing:0.01em; color:${hl?'#A84836':'#4A443C'}; font-family:'DM Sans',sans-serif; padding-top:15px;">${esc(e.t)}</span>
        <span style="width:0; height:9px; border-left:1px dashed #D3C7B2;"></span>
        <span style="width:11px; height:11px; border-radius:3px; background:${hl?'#A84836':'#FFFFFF'}; border:1.5px solid ${hl?'#A84836':'#C9BEA9'}; box-sizing:border-box; transform:rotate(45deg);"></span>
        <span style="flex:1; width:0; border-left:1px dashed #D3C7B2;"></span>
      </div>
      <div style="flex:1; min-width:0; padding:8px 0 14px;">
        <button data-event="${i}" style="display:block; width:100%; text-align:left; color:inherit; background:#FFFFFF; border:1px solid #EFE9DC; border-radius:7px; box-shadow:0 2px 8px rgba(43,43,43,0.05); padding:14px 15px; cursor:pointer; transition:box-shadow 240ms ease-in-out;">
          <p style="margin:0; font-size:14.5px; font-weight:500; line-height:1.68; letter-spacing:0.01em;">${esc(e.d)}</p>
          ${e.n ? `<p style="margin:7px 0 0; font-size:12px; line-height:1.78; color:#5A5249; letter-spacing:0.01em; display:-webkit-box; -webkit-line-clamp:1; -webkit-box-orient:vertical; overflow:hidden;">${esc(e.n)}</p>` : ''}
        </button>
      </div>
    </div>`;
  }).join('');
}

function metaRow(svg, label, value) {
  return `<div style="display:flex; align-items:flex-start; gap:10px;">
    <svg style="flex:none; margin-top:1px;" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#7A8B7B" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${svg}</svg>
    <div>
      <div style="font-size:9px; letter-spacing:0.2em; color:#6E675E; margin-bottom:3px;">${label}</div>
      <div style="font-size:12.5px; color:#3E3A33; line-height:1.6;">${esc(value)}</div>
    </div>
  </div>`;
}

function renderSheet() {
  const d = ITINERARY[dayIdx], e = d.events[openIdx], loc = (e.l && LOC[e.l]) || {};
  const pad = n => String(n).padStart(2, '0');
  document.getElementById('sheet').innerHTML = `
    <div style="background:#FFFFFF; border-bottom:1px dashed #DCD3C3; padding:16px 20px 14px;">
      <div style="display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:12px;">
        <span style="font-size:9px; font-weight:500; letter-spacing:0.22em; color:#6E5A46; font-family:'DM Sans',sans-serif;">DAY ${dayIdx+1} ・ ${d.date}（${d.weekday[2]}）</span>
        <span style="font-size:9px; letter-spacing:0.14em; color:#6E675E; font-family:'DM Sans',sans-serif;">${pad(openIdx+1)} / ${pad(d.events.length)}</span>
      </div>
      <div style="display:flex; align-items:flex-start; gap:13px;">
        <div style="flex:none; display:flex; flex-direction:column; align-items:center; gap:5px; min-width:56px;">
          <span style="font-size:20px; font-weight:500; letter-spacing:-0.01em; color:#A84836; font-family:'DM Sans',sans-serif; line-height:1;">${esc(e.t)}</span>
          <span style="font-size:9px; font-weight:500; letter-spacing:0.12em; color:#5C4033; border:1px solid #E0D8C8; border-radius:3px; padding:2px 6px;">${TAPE[categorize(e)]}</span>
        </div>
        <span style="flex:none; width:1px; align-self:stretch; background:#EFE9DC;"></span>
        <h3 style="flex:1; margin:0; font-size:17px; font-weight:700; line-height:1.56; letter-spacing:0.02em; font-family:'Noto Serif JP',serif;">${esc(e.d)}</h3>
      </div>
    </div>
    <div style="padding:16px 20px 22px; display:flex; flex-direction:column; gap:14px;">
      ${e.n ? `<div>
        <div style="font-size:9px; font-weight:500; letter-spacing:0.24em; color:#8C6239; margin-bottom:7px;">メモ ・ 備註</div>
        <div style="background:#FFFFFF; border:1px solid #EFE9DC; border-left:3px solid #A84836; border-radius:4px; padding:12px 13px;">
          <p style="margin:0; font-size:12.5px; line-height:1.85; color:#3E3A33; letter-spacing:0.01em;">${esc(e.n)}</p>
        </div></div>` : ''}
      ${loc.description ? `<div>
        <div style="font-size:9px; font-weight:500; letter-spacing:0.24em; color:#8C6239; margin-bottom:7px;">案内 ・ 說明</div>
        <p style="margin:0; font-size:12.5px; line-height:1.9; color:#3E3A33; letter-spacing:0.01em;">${esc(loc.description)}</p>
      </div>` : ''}
      ${loc.hours ? `<div style="padding-top:13px; border-top:1px dashed #E0D8C8;">${metaRow(CLOCK_SVG, '時間', loc.hours)}</div>` : ''}
      ${loc.address ? metaRow(PIN_SVG, '住所', loc.address) : ''}
      <div style="display:flex; gap:9px; margin-top:2px;">
        ${loc.mapUrl ? `<a href="${esc(loc.mapUrl)}" target="_blank" rel="noopener noreferrer" style="flex:1; min-height:46px; display:flex; align-items:center; justify-content:center; gap:7px; border-radius:6px; background:#5C4033; color:#F9F8F4; font-size:13px; font-weight:500; letter-spacing:0.06em;">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${MAP_SVG}</svg>開啟地圖</a>` : ''}
        <button id="closeSheet" style="flex:1; min-height:46px; border:1px solid #DCD3C3; border-radius:6px; background:#FFFFFF; color:#4A443C; font-size:13px; font-weight:500; letter-spacing:0.06em; cursor:pointer;">關閉</button>
      </div>
    </div>`;
}

function openSheet(i) {
  openIdx = i; renderSheet();
  const bd = document.getElementById('backdrop'), sh = document.getElementById('sheet');
  bd.style.display = 'flex';
  requestAnimationFrame(() => { bd.style.opacity = '1'; sh.style.transform = 'translateY(0)'; });
}
function closeSheet() {
  const bd = document.getElementById('backdrop'), sh = document.getElementById('sheet');
  bd.style.opacity = '0'; sh.style.transform = 'translateY(16px)';
  setTimeout(() => { bd.style.display = 'none'; openIdx = null; }, 280);
}

document.getElementById('tabRow').innerHTML = TABS.map(([label, on], i) =>
  `<button style="flex:1; display:flex; flex-direction:column; align-items:center; gap:5px; padding:6px 0; border:none; background:none; cursor:pointer; color:${on?'#5C4033':'#6E675E'};">
    <span style="width:38px; height:26px; border-radius:4px; background:${on?'#F2ECE1':'transparent'}; display:flex; align-items:center; justify-content:center; transition:background 240ms ease-in-out;">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="${on?2.1:1.7}" stroke-linecap="round" stroke-linejoin="round">${TAB_SVG[i]}</svg>
    </span>
    <span style="font-size:10.5px; font-weight:500; letter-spacing:0.04em;">${label}</span>
  </button>`).join('');

document.getElementById('dayRow').addEventListener('click', ev => {
  const b = ev.target.closest('[data-day]'); if (!b) return;
  dayIdx = +b.dataset.day; renderDays(); renderDay();
  document.getElementById('main').scrollTop = 0;
});
document.getElementById('timeline').addEventListener('click', ev => {
  const b = ev.target.closest('[data-event]'); if (b) openSheet(+b.dataset.event);
});
document.getElementById('backdrop').addEventListener('click', closeSheet);
document.getElementById('sheet').addEventListener('click', ev => {
  ev.stopPropagation();
  if (ev.target.closest('#closeSheet')) closeSheet();
});
document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && openIdx !== null) closeSheet(); });

renderDays(); renderDay();
</script>
</body>
</html>
